<div class="auth">
  <div class="auth__backdrop" aria-hidden="true"></div>

  <div class="auth__card">
    <h1 class="auth__title">{{ title() }}</h1>

    @if (errorMessage(); as message) {
      <p class="auth__error" role="alert">
        <app-icon name="alert" [size]="17" />
        {{ message }}
      </p>
    }

    <form class="auth__form" [formGroup]="form" (ngSubmit)="submit()">
      @if (isSignUp()) {
        <label class="auth__field">
          <span class="auth__label">Nome</span>
          <input type="text" formControlName="displayName" autocomplete="name" placeholder="Mario Rossi" />
        </label>
      }

      <label class="auth__field">
        <span class="auth__label">Email</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="nome@esempio.it"
          [attr.aria-invalid]="showError('email')"
        />
        @if (showError('email')) {
          <span class="auth__hint">Inserisci un indirizzo email valido.</span>
        }
      </label>

      <label class="auth__field">
        <span class="auth__label">Password</span>
        <input
          type="password"
          formControlName="password"
          [attr.autocomplete]="isSignUp() ? 'new-password' : 'current-password'"
          placeholder="Almeno 6 caratteri"
          [attr.aria-invalid]="showError('password')"
        />
        @if (showError('password')) {
          <span class="auth__hint">La password deve contenere almeno 6 caratteri.</span>
        }
      </label>

      <button type="submit" class="auth__submit" [disabled]="submitting()">
        {{ submitting() ? 'Attendi…' : submitLabel() }}
      </button>
    </form>

    <div class="auth__divider"><span>oppure</span></div>

    <button type="button" class="auth__google" [disabled]="submitting()" (click)="signInWithGoogle()">
      <!-- Logo Google a quattro colori: non segue currentColor come le altre icone. -->
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
        <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h11.8c-.5 2.7-2 5-4.4 6.6v5.5h7.1c4.1-3.8 6.6-9.4 6.6-16.1z"/>
        <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.4l-7.1-5.5c-2 1.3-4.5 2.1-7.4 2.1-5.7 0-10.5-3.8-12.2-9H4.5v5.7C8.1 41.1 15.4 46 24 46z"/>
        <path fill="#FBBC05" d="M11.8 28.2c-.4-1.3-.7-2.7-.7-4.2s.3-2.9.7-4.2v-5.7H4.5C3 17.1 2.1 20.4 2.1 24s.9 6.9 2.4 9.9l7.3-5.7z"/>
        <path fill="#EA4335" d="M24 10.4c3.2 0 6.1 1.1 8.4 3.3l6.3-6.3C34.9 3.9 29.9 2 24 2 15.4 2 8.1 6.9 4.5 14.1l7.3 5.7c1.7-5.2 6.5-9.4 12.2-9.4z"/>
      </svg>
      Continua con Google
    </button>

    <p class="auth__switch">
      {{ isSignUp() ? 'Hai già un account?' : 'Non hai ancora un account?' }}
      <button type="button" (click)="toggleMode()">
        {{ isSignUp() ? 'Accedi' : 'Registrati ora' }}
      </button>
    </p>

    <p class="auth__note">
      Autenticazione simulata in locale: nessun dato lascia questo browser.
    </p>
  </div>
</div>
