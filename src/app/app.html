@if (!isConfigured) {
  <!--
    Senza chiave API ogni chiamata a TMDB fallisce con 401: meglio spiegare
    cosa manca che lasciare l'utente davanti a caroselli vuoti.
  -->
  <div class="setup" role="alert">
    <app-icon name="alert" [size]="20" />
    <p>
      <strong>Chiave TMDB mancante.</strong>
      Apri <code>src/environments/environment.ts</code> e sostituisci
      <code>apiKey</code> con la tua API Key v3, poi riavvia il server di sviluppo.
    </p>
  </div>
}

<app-header />

<main class="shell">
  <router-outlet />
</main>

<footer class="footer">
  <p>
    Dati e immagini forniti da
    <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>.
    Questo prodotto non è approvato né certificato da TMDB.
  </p>
  <p class="footer__copy">© {{ year }} Xflix — progetto dimostrativo.</p>
</footer>

<app-detail-modal />
